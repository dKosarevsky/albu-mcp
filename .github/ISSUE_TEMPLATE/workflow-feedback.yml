name: Preview workflow feedback
description: Report noisy, distorted, unreadable, or awkward augmentation review loops.
title: "[Workflow Feedback]: "
labels:
  - workflow-feedback
  - preview-review
body:
  - type: markdown
    attributes:
      value: |
        Share one real render -> reject -> adjust -> accept loop, or the blocker that prevented it.
        Do not upload private datasets or images, proprietary training data, credentials, personal data, or unredacted paths.
  - type: dropdown
    id: campaign
    attributes:
      label: Campaign or use case
      description: Choose the workflow you followed; use general-or-not-sure when no campaign applies.
      options:
        - classification-robustness
        - detection-bbox-safety
        - segmentation-mask-safety
        - general-or-not-sure
    validations:
      required: true
  - type: dropdown
    id: discovery_source
    attributes:
      label: Discovery source
      description: Optional aggregate attribution; no tracking identifier is collected.
      options:
        - official-albumentations-docs
        - albumentations-discord
        - x-twitter
        - github
        - mcp-registry
        - pypi
        - skills-sh
        - other-or-not-sure
  - type: dropdown
    id: install_route
    attributes:
      label: Install route
      description: Optional package-level conversion context.
      options:
        - claude-desktop-mcpb
        - uvx
        - pip
        - source-checkout
        - other-or-not-sure
  - type: dropdown
    id: task
    attributes:
      label: Task
      options:
        - classification
        - detection
        - segmentation
        - OCR
        - balanced
        - other
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: MCP host
      placeholder: "Claude Desktop / Claude Code / Cursor / Codex"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the augmentation make robust, and what would a useful result preserve?
      placeholder: "Increase classification robustness to lighting and mild sensor noise while keeping objects recognizable."
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow context
      description: Mention resources/tools used, such as albumentationsx://examples/distortion-review.
      placeholder: "recommend_pipeline -> render_preview_batch -> adjust_pipeline -> compare_preview_runs -> export_preview_report"
    validations:
      required: true
  - type: textarea
    id: initial_render
    attributes:
      label: Initial render
      description: Include feedback tags such as too_noisy, too_blurry, too_distorted, too_dark, or acceptable.
      placeholder: "too_noisy:high on candidate 2; object is no longer recognizable."
    validations:
      required: true
  - type: textarea
    id: rejection
    attributes:
      label: Rejection
      description: Which result did you reject and why? Write accepted on first render if no rejection was needed.
    validations:
      required: true
  - type: textarea
    id: adjustment
    attributes:
      label: Adjustment
      description: What did you ask the host to change, and what did the MCP do next?
      placeholder: "Reduce noise, keep crop/flip behavior, render again, then compare_preview_runs."
    validations:
      required: true
  - type: dropdown
    id: workflow_outcome
    attributes:
      label: Workflow outcome
      description: Only accepted-after-adjustment counts as a complete render -> reject -> adjust -> accept loop.
      options:
        - accepted-after-adjustment
        - accepted-first-render
        - blocked-before-render
        - unresolved-after-adjustment
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the accepted result or unresolved blocker and the smallest product change that would help.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Safe artifact references
      description: Share preview run IDs, contact sheet paths with private segments redacted, or synthetic demo images only.
  - type: textarea
    id: exported-report
    attributes:
      label: Report output
      description: Paste relevant export_preview_report or compare_preview_runs excerpts if they are safe to share.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private images, absolute local paths, credentials, personal data, and proprietary dataset details.
          required: true
