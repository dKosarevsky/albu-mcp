name: Published upgrade proof

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Published version to upgrade from
        required: true
        default: "1.20.0"
        type: string
      to_version:
        description: Published version to upgrade to
        required: true
        default: "1.21.0"
        type: string

permissions:
  contents: read

jobs:
  prove-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install current client and probe dependencies
        run: uv sync --frozen --dev

      - name: Prepare artifact directory
        run: install -d -m 700 artifacts

      - name: Prove published upgrade
        env:
          FROM_VERSION: ${{ inputs.from_version }}
          TO_VERSION: ${{ inputs.to_version }}
        run: >
          uv run python scripts/check_published_upgrade.py
          --from-version "$FROM_VERSION"
          --to-version "$TO_VERSION"
          --observed-on "$(date -u +%F)"
          --output artifacts/published-upgrade-proof.json

      - name: Bind evidence to public run
        run: >
          uv run python scripts/export_published_upgrade_provenance.py
          --evidence artifacts/published-upgrade-proof.json
          --repository "$GITHUB_REPOSITORY"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --run-id "$GITHUB_RUN_ID"
          --run-head-sha "$GITHUB_SHA"
          --verification-method workflow_output
          --output artifacts/published-upgrade-provenance.json

      - name: Upload privacy-safe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-upgrade-proof
          path: |
            artifacts/published-upgrade-proof.json
            artifacts/published-upgrade-provenance.json
          if-no-files-found: error
          retention-days: 30
